[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thinq-control-demo"
version = "0.2.0"
description = "Local ThinQ control demo with explicit mock/live modes"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
web = ["thinqconnect==1.0.14", "aiohttp==3.14.5"]

[tool.setuptools.package-data]
thinq_demo = ["static/*"]

[tool.setuptools.packages.find]
include = ["thinq_demo*"]
